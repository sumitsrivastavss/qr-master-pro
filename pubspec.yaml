name: qr_master_premium
description: "A Premium QR Scanner and Generator App."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.0
  font_awesome_flutter: ^10.7.0
  
  # QR Code Core Features
  mobile_scanner: ^5.2.0       # Fast live scanning
  qr_flutter: ^4.1.0           # For generating QR codes
  
  # State Management & Storage
  shared_preferences: ^2.2.3   # Settings save karne ke liye
  path_provider: ^2.1.3        # Storage path ke liye
  gal: ^2.3.0                  # Gallery mein save/download karne ke liye (No Coming Soon!)
  
  # Share and Animations
  share_plus: ^9.0.0           # QR ya result share karne ke liye
  url_launcher: ^6.3.0         # Links open karne ke liye

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true