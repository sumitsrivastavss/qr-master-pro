name: qr_master_pro
description: "A Professional QR Scanner and QR Generator App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0

  # QR Scanner & Generator
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  gal: ^2.3.0

  # Share & URL
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  