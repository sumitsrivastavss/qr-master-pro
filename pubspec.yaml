name: qr_master_pro
description: "A Professional QR Scanner and QR Generator App."
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.0
  font_awesome_flutter: ^10.7.0

  # QR Code Core Features
  mobile_scanner: ^5.2.0
  qr_flutter: ^4.1.0

  # State Management & Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  gal: ^2.3.0

  # Share & Utilities
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"